# Déploiement prod — Traefik + images GitHub Actions
# Variables : fichier .env dans ce dossier (chargé auto par Docker Compose).
# Serveur : cp .env.example .env  (Watchtower / compose lisent .env seul)
# Usage repo : docker compose -f docker-compose.prod.yml up -d
# Sur le serveur : copier ce fichier en docker-compose.yml → docker compose up -d

name: karma-prod

services:
  db:
    image: postgres:16-alpine
    container_name: karma-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-karma}
    volumes:
      - karma_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karma} -d ${POSTGRES_DB:-karma}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - karma_internal

  api:
    image: ${REGISTRY}/karma/api:${KARMA_TAG:-latest}
    container_name: karma-prod-api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-karma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-karma}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      KARMA_DAILY_DECAY: ${KARMA_DAILY_DECAY:-5}
      KARMA_MAX: ${KARMA_MAX:-100}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis}
      SEED_DEV_USERS: "false"
    volumes:
      - ${KARMA_DATA_PATH:-/opt/karma}/uploads:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # HTTPS (443)
      - "traefik.http.routers.karma-api-prod.rule=Host(`${KARMA_API_HOST:?KARMA_API_HOST requis}`)"
      - "traefik.http.routers.karma-api-prod.entrypoints=websecure"
      - "traefik.http.routers.karma-api-prod.tls=true"
      - "traefik.http.routers.karma-api-prod.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-myresolver}"
      - "traefik.http.services.karma-api-prod.loadbalancer.server.port=3001"
      - "traefik.http.routers.karma-api-prod.middlewares=${TRAEFIK_RATE_LIMIT_MIDDLEWARE:-rate-limit-global@file}"

      # HTTP (80) → redirection HTTPS
      - "traefik.http.routers.karma-api-prod-http.rule=Host(`${KARMA_API_HOST}`)"
      - "traefik.http.routers.karma-api-prod-http.entrypoints=web"
      - "traefik.http.routers.karma-api-prod-http.middlewares=${TRAEFIK_HTTPS_REDIRECT_MIDDLEWARE:-redirect-to-https@file}"
    networks:
      - karma_internal
      - traefik_proxy

  web:
    image: ${REGISTRY}/karma/web:${KARMA_TAG:-latest}
    container_name: karma-prod-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL requis}
    depends_on:
      - api
    labels:
      - "traefik.enable=true"

      # HTTPS (443)
      - "traefik.http.routers.karma-web-prod.rule=Host(`${KARMA_WEB_HOST:?KARMA_WEB_HOST requis}`)"
      - "traefik.http.routers.karma-web-prod.entrypoints=websecure"
      - "traefik.http.routers.karma-web-prod.tls=true"
      - "traefik.http.routers.karma-web-prod.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-myresolver}"
      - "traefik.http.services.karma-web-prod.loadbalancer.server.port=3000"
      - "traefik.http.routers.karma-web-prod.middlewares=${TRAEFIK_RATE_LIMIT_MIDDLEWARE:-rate-limit-global@file}"

      # HTTP (80) → redirection HTTPS
      - "traefik.http.routers.karma-web-prod-http.rule=Host(`${KARMA_WEB_HOST}`)"
      - "traefik.http.routers.karma-web-prod-http.entrypoints=web"
      - "traefik.http.routers.karma-web-prod-http.middlewares=${TRAEFIK_HTTPS_REDIRECT_MIDDLEWARE:-redirect-to-https@file}"
    networks:
      - traefik_proxy

volumes:
  karma_pg_data:

networks:
  karma_internal:
  traefik_proxy:
    external: true
